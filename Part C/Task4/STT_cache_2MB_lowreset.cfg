# Part C Task 1: 2MB STT-MRAM Cache Configuration
# Matched to Part B CACTI SRAM baseline parameters:
#   - Capacity: 2MB
#   - Process: 45nm
#   - Associativity: 8-way
#   - Word width: 512 bits (64B line)
#   - Temperature: 350K
#   - Design target: cache
#   - Optimization: ReadLatency (to match CACTI delay-optimized baseline)

-DesignTarget: cache

-CacheAccessMode: Normal

-OptimizationTarget: ReadLatency

-EnablePruning: Yes

-ProcessNode: 45

-Capacity (MB): 2
-WordWidth (bit): 512
-Associativity (for cache only): 8

-DeviceRoadmap: HP

-LocalWireType: LocalAggressive
-LocalWireRepeaterType: RepeatedNone
-LocalWireUseLowSwing: No

-GlobalWireType: GlobalAggressive
-GlobalWireRepeaterType: RepeatedNone
-GlobalWireUseLowSwing: No

-Routing: H-tree

-InternalSensing: true

-MemoryCellInputFile: ./STT_MRAM_lowreset.cell

-Temperature (K): 350

-BufferDesignOptimization: latency

-UseCactiAssumption: Yes
